<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CruxTrap{% endblock %} · CruxTrap SOC</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23f85149'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="dot"></span>CruxTrap <small>SOC</small></a>
    <nav>
      <a href="/" class="{{ 'on' if active == 'overview' }}">Overview</a>
      <a href="/sessions" class="{{ 'on' if active in ('sessions', 'session') }}">Sessions</a>
      <a href="/attackers" class="{{ 'on' if active in ('attackers', 'attacker') }}">Attackers</a>
      <a href="/rl" class="{{ 'on' if active == 'rl' }}">RL Agent</a>
    </nav>
    <span class="live" id="live" title="Auto-refreshing stats">● live</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>CruxTrap · adaptive SSH honeypot · read-only analyst view</footer>
  <script src="/static/app.js"></script>
</body>
</html>
